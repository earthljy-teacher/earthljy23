<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선크림 마스터: 자외선 방어 작전</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#fff7ec;--card:#ffffff;--ink:#3b4150;--sub:#7a8090;--sun:#f07f00;--uv:#7b3fe4;--blue:#1f6fd6;--green:#13935c;--red:#d9443a;--pink:#e0457b;--line:#f1dcc0;--soft:#fff3e2}
@font-face{font-family:'ACinemaL';src:local('a시네마L'),local('aCinemaL'),local('a시네마 L'),local('a시네마');}
*{box-sizing:border-box;font-family:'a시네마L','ACinemaL','aCinemaL','a시네마','aCinema','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400!important}
b,strong,h1,h2,h3,h4,h5,th,button,select,label{font-weight:400!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:17px;line-height:1.75;word-break:keep-all}
header{background:linear-gradient(100deg,#ffb347,#ff7e5f 60%,#c86dd7);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.title{font-size:24px;line-height:1.3}.title small{display:block;font-size:14px;opacity:.95}
.brand{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:14px;padding:6px 12px;margin-left:auto}
.brand .lg{font-size:17px;color:#1f6fd6;letter-spacing:1.5px;line-height:1.2}.brand .lg span{color:#13a36a}
.brand .em{font-size:12.5px;color:#7a8090;line-height:1.2}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.nb{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:14.5px;color:var(--ink);cursor:pointer}
.nb.on{background:var(--sun);color:#fff;border-color:var(--sun)}
.nb.ok:not(.on){color:var(--green);border-color:#9fdcc1}
.nb.lock{color:#b8b8c0;background:#f6f6f8;cursor:not-allowed}
main{max-width:1000px;margin:0 auto;padding:18px 14px 90px}
.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 4px 16px rgba(240,127,0,.08);border:1px solid var(--line)}
h2{font-size:25px;color:var(--sun);margin:0 0 6px;line-height:1.4}
h3{font-size:19.5px;color:var(--blue);margin:4px 0 10px;line-height:1.45}
.lead{font-size:17.5px}
.c-uv{color:var(--uv)}.c-sun{color:var(--sun)}.c-blue{color:var(--blue)}.c-green{color:var(--green)}.c-red{color:var(--red)}.c-pink{color:var(--pink)}.c-sub{color:var(--sub)}
.small{font-size:14px}
.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.concept{border-radius:14px;padding:14px 16px}
.concept.uva{background:#f3ecff;border:1px solid #d9c7ff}.concept.uvb{background:#fff0ea;border:1px solid #ffd0bf}
.ctag{font-size:19px;margin-bottom:4px}.concept.uva .ctag{color:var(--uv)}.concept.uvb .ctag{color:var(--red)}
.concept p{margin:6px 0}
.tip{background:var(--soft);border-left:5px solid var(--sun);border-radius:10px;padding:10px 14px;margin-top:14px}
.btn{background:var(--sun);color:#fff;border:none;border-radius:12px;padding:10px 18px;font-size:16.5px;cursor:pointer;margin:6px 6px 0 0}
.btn:hover{filter:brightness(1.07)}.btn:disabled{background:#d6d6dc;cursor:not-allowed}
.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}.btn.uv{background:var(--uv)}.btn.ghost{background:#fff;color:var(--sun);border:1px solid var(--sun)}
.btn.sm{font-size:15px;padding:7px 14px}
input[type=text],select,textarea{font-size:16px;border:1px solid #e3cfb0;border-radius:10px;padding:8px 10px;background:#fffdf9;color:var(--ink)}
textarea{width:100%;resize:vertical;line-height:1.6}
.q{border:1px dashed #efcf9f;border-radius:14px;padding:14px;margin:12px 0;background:#fffdf8}
.qt{margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{text-align:left;border:1px solid #e9d6b8;background:#fff;border-radius:10px;padding:9px 12px;font-size:16px;cursor:pointer;color:var(--ink)}
.opt:hover{background:#fff6e8}.opt.sel{border-color:var(--blue);background:#eaf2ff;color:var(--blue)}
.opt.wrong{border-color:#f2a49e;background:#fff0ef;color:var(--red)}.opt.right{border-color:#87d3ae;background:#e9f9f0;color:var(--green)}
.fb{margin-top:8px;font-size:15.5px}.fb.good{color:var(--green)}.fb.bad{color:var(--red)}
.fb .tip2{color:var(--blue);display:block;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px;padding:10px;border-radius:12px;background:#f7f2ff}
.chip{padding:6px 14px;border-radius:999px;background:#fff;border:1px solid #cdb6ff;color:var(--uv);cursor:grab;user-select:none;font-size:16px}
.chip.sel{background:var(--uv);color:#fff}
.chip.spf{border-color:#ffb9a3;color:var(--red)}.chip.spf.sel{background:var(--red);color:#fff}
.sit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.sit .st{flex:1 1 240px}
.slot{min-width:92px;min-height:36px;border:2px dashed #d9c3a2;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:2px 10px;cursor:pointer;color:var(--sub);font-size:15px;background:#fffaf3}
.slot.filled{border-style:solid;color:var(--ink)}.slot.bad{border-color:var(--red);background:#fff0ef}.slot.good{border-color:var(--green);background:#ecfaf3}
.sit .hint{flex-basis:100%;font-size:14.5px;color:var(--red)}
.indsel{margin-bottom:10px}
.wells{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.well{border:1px solid #ecdcc4;border-radius:12px;padding:10px;text-align:center;background:#fffcf7}
.well label{display:block;font-size:14px;margin-top:6px}.well select{width:100%;margin-top:2px}
.wdot{width:38px;height:38px;border-radius:50%;margin:0 auto 4px;background:radial-gradient(circle at 35% 35%,#fff,#f3e7d2);border:1px solid #e5d3b5}
.wlab{font-size:15px;color:var(--blue);line-height:1.4}
.row-card.done{border-color:#9fdcc1;background:#f6fffa}
.lab{position:relative;background:linear-gradient(#2b2440,#3b3155);border-radius:18px;padding:16px;color:#fff;overflow:hidden}
.lamp{width:70%;margin:0 auto 18px;height:34px;border-radius:0 0 40px 40px;background:#555066;position:relative;display:flex;align-items:center;justify-content:center;font-size:14px;color:#ddd}
.lamp.on{background:#8f5cff;box-shadow:0 0 30px 10px rgba(160,100,255,.7);color:#fff}
.rays{position:absolute;left:0;right:0;top:50px;bottom:0;pointer-events:none;opacity:0;transition:opacity .6s;background:repeating-linear-gradient(90deg,rgba(170,120,255,.0) 0 22px,rgba(170,120,255,.18) 22px 30px)}
.lab.on .rays{opacity:1;animation:shim 1.2s linear infinite}
@keyframes shim{0%{background-position:0 0}100%{background-position:30px 0}}
.film{position:relative;background:rgba(220,235,255,.13);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:12px}
.frow{display:grid;grid-template-columns:86px repeat(3,1fr);gap:8px;align-items:center;margin-bottom:8px}
.frow .rl{font-size:13.5px;color:#ffd79a;line-height:1.3}
.cell{text-align:center;font-size:12.5px;color:#e9e4ff;line-height:1.3}
.stk{position:relative;width:58px;height:58px;border-radius:50%;margin:0 auto 4px;background:#fdfaf2;border:2px solid rgba(255,255,255,.75);transition:background-color 15s linear;overflow:hidden}
.stk .patch{position:absolute;inset:0;border-radius:50%;opacity:0;transition:opacity 15s linear;background:radial-gradient(circle at 30% 35%,rgba(94,23,160,.95) 0 22%,transparent 23%),radial-gradient(circle at 68% 62%,rgba(94,23,160,.9) 0 18%,transparent 19%),radial-gradient(circle at 55% 25%,rgba(94,23,160,.75) 0 10%,transparent 11%)}
.count{text-align:center;font-size:20px;color:#ffd79a;margin:6px 0}
.legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;margin:8px 0}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid #ccc;display:inline-flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;color:#555}
.sw.dark{color:#fff}.sw.sel{outline:3px solid var(--sun);outline-offset:1px}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.rbox{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.rbox.bad{border-color:var(--red);background:#fff2f1}
.rbox .sws{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid #eedcc3;padding:6px 8px;text-align:center}
th{background:#fff1dc;color:var(--sun)}
.anim{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ap{position:relative;height:230px;border-radius:14px;overflow:hidden;background:linear-gradient(#e9f3ff,#fdf6ff)}
.ap .cap{position:absolute;top:6px;left:10px;font-size:15px}
.skin{position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(#ffd7c4,#f5b49a);display:flex;align-items:center;justify-content:center;font-size:13px;color:#8a4b37}
.layer{position:absolute;left:0;right:0;bottom:56px;height:34px;display:flex;justify-content:space-around;align-items:center}
.pt{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#cfd5de);border:1px solid #aab;font-size:8px;display:flex;align-items:center;justify-content:center;color:#556}
.mol{font-size:24px;color:#e98a2a;transition:text-shadow .3s}
.ph{position:absolute;width:14px;height:14px;border-radius:50%;background:#8b4dff;box-shadow:0 0 10px 4px rgba(139,77,255,.6);top:30px;opacity:0}
.heat{position:absolute;font-size:20px;color:#ff6a2a;opacity:0}
.play .ph.r1{animation:refl 2.6s ease-in infinite}
.play .ph.r2{animation:refl 2.6s ease-in .9s infinite}
.play .ph.r3{animation:refl 2.6s ease-in 1.7s infinite}
@keyframes refl{0%{opacity:1;transform:translate(0,0)}45%{opacity:1;transform:translate(18px,110px)}100%{opacity:0;transform:translate(70px,-10px)}}
.play .ph.a1{animation:abs 2.6s ease-in infinite}
.play .ph.a2{animation:abs 2.6s ease-in .9s infinite}
.play .ph.a3{animation:abs 2.6s ease-in 1.7s infinite}
@keyframes abs{0%{opacity:1;transform:translate(0,0)}45%{opacity:1;transform:translate(10px,112px)}52%{opacity:0;transform:translate(10px,116px)}100%{opacity:0}}
.play .heat.h1{animation:heat 2.6s ease-out infinite}
.play .heat.h2{animation:heat 2.6s ease-out .9s infinite}
.play .heat.h3{animation:heat 2.6s ease-out 1.7s infinite}
@keyframes heat{0%,50%{opacity:0;transform:translateY(0)}60%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.play .mol{animation:glow 2.6s infinite}
@keyframes glow{0%,40%{text-shadow:none}50%,65%{text-shadow:0 0 12px #ff7b00,0 0 22px #ffb300}100%{text-shadow:none}}
.sortwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;border-radius:12px;background:#f5f5f8;border:1px dashed #ccc}
.col{min-height:140px;border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.col.phys{background:#eef5ff;border:2px dashed #9cc2f5}.col.chem{background:#fff3e8;border:2px dashed #f7bb84}
.col .ch{width:100%;font-size:16px}.col.phys .ch{color:var(--blue)}.col.chem .ch{color:var(--sun)}
.ccard{background:#fff;border:1px solid #ddd;border-radius:10px;padding:5px 10px;font-size:14.5px;cursor:grab;user-select:none}
.ccard.sel{border-color:var(--uv);color:var(--uv);box-shadow:0 0 0 2px #d9c7ff}
.ccard.bad{border-color:var(--red);color:var(--red)}
.profile{display:flex;gap:14px;align-items:center;background:linear-gradient(90deg,#fff4e0,#f3ecff);border-radius:14px;padding:14px}
.profile .em{font-size:48px}
.rx{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center;margin-top:14px}
.rx select{width:100%}
.rx .bad{color:var(--red);font-size:14px;grid-column:2}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3b3155;color:#fff;padding:10px 18px;border-radius:12px;font-size:15.5px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.map div{background:var(--soft);border-radius:12px;padding:10px;font-size:15px}
.map div span{display:block;color:var(--sun);font-size:16.5px}
.grade{font-size:84px;line-height:1;width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto}
.rep-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.bar{height:12px;background:#f1e6d6;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.sc-row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:15.5px}
.narr p{margin:6px 0 10px}
.wbox{background:#fffaf2;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 12px;white-space:pre-wrap;font-size:15.5px}
.up{border:2px solid #ffcf8f;background:#fff8ec;border-radius:14px;padding:14px}
.up .it{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px dashed #f0d2a6;padding:8px 0}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px}
.pbox{display:flex;flex-direction:column}
.pp{position:relative;height:240px;border-radius:14px;overflow:hidden;background:linear-gradient(#e9f3ff,#fdf6ff);border:1px solid #e3d9f5}
.pp .cap{position:absolute;top:6px;left:10px;font-size:16px}
.pp .layer{bottom:50px;height:40px}.pp .skin{height:50px}
.pt{transition:box-shadow .2s,transform .2s}.pt.hit{box-shadow:0 0 0 4px rgba(31,111,214,.45);transform:scale(1.15)}
.mol.on{text-shadow:0 0 12px #ff7b00,0 0 22px #ffb300;color:#ff7b00}
.uvp{position:absolute;width:16px;height:16px;border-radius:50%;background:#8b4dff;box-shadow:0 0 12px 5px rgba(139,77,255,.6);opacity:0;transition:top 1.2s ease-in,opacity .3s}
.hw{position:absolute;color:#ff5a1f;font-size:15px;line-height:1.1;text-align:center;transition:top 1.8s ease-out,opacity 1.8s ease-in}
.ptag{position:absolute;top:104px;font-size:14px;background:rgba(255,255,255,.85);border-radius:8px;padding:0 6px;white-space:nowrap}
.pcap{min-height:58px;background:#faf6ff;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:15px;line-height:1.55}
.steps{margin:8px 0 0;padding-left:4px;list-style:none;font-size:14px;color:#9a9fae}
.steps li{padding:3px 6px;border-radius:8px;margin-bottom:3px}.steps li.on{background:#fff3e2;color:var(--ink)}
.ptab td:first-child{background:#fffaf2;color:var(--sun);white-space:nowrap}
.ptab td{text-align:left;line-height:1.55}.ptab th.pc{background:#eaf2ff;color:var(--blue)}.ptab th.cc{background:#fff0e0;color:var(--sun)}
.mixbox{margin-top:12px;background:#fff0f6;border:1px solid #f7c3d7;border-radius:12px;padding:10px 14px}
@media (max-width:680px){
 .pgrid{grid-template-columns:1fr}
 body{font-size:16px}.title{font-size:20px}
 .grid2,.anim,.sortwrap,.map{grid-template-columns:1fr}
 .wells,.rec{grid-template-columns:1fr 1fr 1fr;gap:6px}
 .well{padding:6px}.well select{font-size:13px;padding:5px}
 .frow{grid-template-columns:60px repeat(3,1fr)}.stk{width:46px;height:46px}
 .rx{grid-template-columns:1fr}.rx .bad{grid-column:1}
 .sc-row{grid-template-columns:110px 1fr 56px}
 .brand{margin-left:0}
}
</style>
</head>

function renderNav(){const n=document.getElementById('nav');n.innerHTML='';
 NAV.forEach((v,i)=>{const lock=i>ST.unlocked;const b=document.createElement('button');
  b.className='nb'+(i===ST.cur?' on':'')+(lock?' lock':'')+(ST.done[i]?' ok':'');
  b.innerHTML=`${lock?'🔒':(ST.done[i]?'✅':v[1])} ${i>=1&&i<=6?'Stage '+i+' ':''}${v[0]}`;
  b.onclick=()=>{if(lock){toast('🔒 이전 단계를 완료해야 잠금이 해제됩니다.');return}go(i)};n.appendChild(b)})}
function go(i){ST.cur=i;renderNav();const m=document.getElementById('main');m.innerHTML='';R[i](m);window.scrollTo({top:0,behavior:'smooth'})}
function complete(n,score,m){
 const was=!!ST.done[n],old=ST.score[n];score=Math.max(0,Math.min(ST.max[n],Math.round(score*10)/10));
 ST.score[n]=Math.max(old,score);ST.done[n]=true;ST.unlocked=Math.max(ST.unlocked,n+1);renderNav();
 const toRes=n===6||(was&&ST.unlocked>=7);
 const box=div('card','');box.style.borderColor='#9fdcc1';box.style.background='#f4fff9';
 box.innerHTML=`<h2 class="c-green">🔓 ${SNAME[n]} 완료!</h2><p>이번 수행 점수: <span class="c-blue">${score}</span> / ${ST.max[n]}점${was?` <span class="c-sub">(재도전: 기존 ${old}점 → 반영 점수 </span><span class="c-green">${ST.score[n]}점</span><span class="c-sub">, 더 높은 점수가 반영됩니다)</span>`:''}</p>`;
 box.appendChild(btn(toRes?'🏆 미션 성공 탭으로 이동':`다음 단계로 이동 ▶`,()=>go(toRes?7:n+1),'btn green'));
 m.appendChild(box);setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'center'}),100)}
function startRun(n){ST.runs[n]++;ST.log[n]={};return ST.log[n]}
function retryNote(n){return ST.done[n]?`<div class="tip">🔁 <span class="c-pink">재도전 모드</span> — 이 단계를 다시 수행하면 기존 점수(${ST.score[n]}점)와 비교해 <span class="c-green">더 높은 점수</span>가 반영됩니다.</div>`:''}

/* ===================== 객관식 / 서술형 컴포넌트 ===================== */
function mcq(parent,o){
 const w=div('q',`<div class="qt">${o.q}</div><div class="opts"></div><div class="fb"></div>`);
 const opts=w.querySelector('.opts'),fb=w.querySelector('.fb');let tries=0,sel=new Set(),done=false;
 o.opts.forEach((t,i)=>{const b=btn(t,()=>{if(done)return;
   if(o.multi){sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel');return}
   check([i],b)},'opt');opts.appendChild(b)});
 if(o.multi)w.appendChild(btn('선택 완료 · 정답 확인',()=>{if(done)return;if(!sel.size){toast('하나 이상 선택하세요.');return}check([...sel])},'btn sm blue'));
 function check(arr,b){tries++;const ans=[].concat(o.ans);
  const ok=arr.length===ans.length&&arr.every(x=>ans.includes(x));
  if(ok){done=true;[...opts.children].forEach((x,i)=>{x.classList.remove('wrong','sel');if(ans.includes(i))x.classList.add('right')});
   fb.className='fb good';fb.innerHTML=`⭕ 정답입니다! ${o.exp||''}`;o.onDone&&o.onDone(tries===1,tries)}
  else{if(b)b.classList.add('wrong');fb.className='fb bad';
   let f=typeof o.fb==='string'?o.fb:'';if(!o.multi&&o.fb&&typeof o.fb==='object'&&o.fb[arr[0]])f=o.fb[arr[0]];
   fb.innerHTML=`❌ 다시 생각해 보세요. ${f||''}<span class="tip2">→ 다른 답을 골라 다시 도전할 수 있어요.</span>`;o.onWrong&&o.onWrong()}}
 parent.appendChild(w);return w}
function evalText(t,groups,need){const s=t.replace(/\s+/g,' ');const hit=[],miss=[];
 groups.forEach(g=>(g.kw.some(k=>s.toLowerCase().includes(k.toLowerCase()))?hit:miss).push(g));
 return{hit,miss,ratio:Math.min(1,hit.length/(need||groups.length))}}
function writer(parent,o){
 const w=div('q',`<div class="qt">✍️ ${o.q}</div><textarea rows="4" placeholder="${o.ph||'자신의 말로 문장을 완성하여 써 보세요.'}"></textarea><div class="small c-sub cnt">0자 (최소 ${o.min}자)</div><div class="fb"></div>`);
 const ta=w.querySelector('textarea'),cnt=w.querySelector('.cnt'),fb=w.querySelector('.fb');let best=0,sub=0;
 if(ST.write[o.key])ta.value=ST.write[o.key];
 ta.oninput=()=>cnt.textContent=`${ta.value.trim().length}자 (최소 ${o.min}자)`;
 w.appendChild(btn('제출하고 피드백 받기',()=>{const t=ta.value.trim();
  if(t.length<o.min){fb.className='fb bad';fb.innerHTML=`❌ 조금 더 자세히 써 주세요. 최소 ${o.min}자 이상 작성해야 합니다. (현재 ${t.length}자)`;return}
  sub++;const r=evalText(t,o.groups,o.need);best=Math.max(best,r.ratio);ST.write[o.key]=t;
  let h='';if(r.hit.length)h+=`<span class="c-green">👍 잘 들어간 내용: ${r.hit.map(g=>g.n).join(', ')}</span><br>`;
  if(r.ratio>=1)h+=`<span class="c-green">⭕ 핵심 내용을 모두 갖춘 훌륭한 답안입니다!</span>`;
  else{h+=`<span class="c-red">❗ 보완이 필요한 내용:</span>`+r.miss.slice(0,4).map(g=>`<span class="tip2">· ${g.n} — ${g.hint}</span>`).join('')+`<span class="tip2 c-sub">고쳐 쓴 뒤 다시 제출하면 더 높은 점수가 반영됩니다.</span>`}
  fb.className='fb';fb.innerHTML=h;o.onSubmit&&o.onSubmit(best,sub)},'btn sm blue'));
 parent.appendChild(w);return w}

const WEAK={1:'SPF·PA 개념과 상황별 지수 처방',2:'무기·유기·혼합자차 차단 원리 구분',3:'독립변인·통제변인 설계',4:'시광 스티커 관찰 기록의 정확성',5:'결과 해석과 오차 원인·개선 방안',6:'맞춤형 처방전 작성'};
R[7]=function(m){
 const tot=Math.round([1,2,3,4,5,6].reduce((a,n)=>a+ST.score[n],0)*10)/10,g=gradeOf(tot);
 const nextT={B:90,C:80,D:70,F:60}[g];
 const weak=[1,2,3,4,5,6].filter(n=>ST.score[n]/ST.max[n]<.8).sort((a,b)=>(ST.max[b]-ST.score[b])-(ST.max[a]-ST.score[a]));
 const ws=[['Stage 5 · 실험 개선 방안',ST.write.s4],['Stage 6 · 맞춤형 처방전',ST.rx?`[${CHR[ST.chr].name}] ${ST.rx}`:'']];
 const today=new Date().toLocaleDateString('ko-KR');
 m.innerHTML=`<div class="card" id="report">
  <div class="rep-head"><div><h2 style="margin:0">🏆 미션 성공! 자외선 방어 작전 리포트</h2><div class="c-sub small">${today} · 연구원 <span class="c-blue">${ST.sid} ${ST.name}</span></div></div>
   <div class="brand" style="margin-left:0;border:1px solid var(--line)">${document.querySelector('#brand img').outerHTML}<div><div class="lg">EARTH <span>LJY</span></div><div class="em">earthljy@ai.jne.kr</div></div></div></div>
  <div class="grid2" style="align-items:center"><div style="text-align:center"><div class="grade" style="background:${GC[g]}">${g}</div><div style="margin-top:8px">총점 <span style="color:${GC[g]};font-size:24px">${tot}</span> / 100점</div><div class="small c-sub">A 90↑ · B 80↑ · C 70↑ · D 60↑ · F 60 미만</div></div>
   <div>${[1,2,3,4,5,6].map(n=>{const rt=ST.score[n]/ST.max[n];const c=rt>=.9?'#13935c':rt>=.8?'#1f6fd6':rt>=.6?'#f07f00':'#d9443a';return `<div class="sc-row"><div>${SNAME[n].replace(' 관문','')}</div><div class="bar"><i style="width:${rt*100}%;background:${c}"></i></div><div style="color:${c}">${ST.score[n]}/${ST.max[n]}</div></div>`}).join('')}</div></div>
  <h3>🧭 과제 수행 과정 피드백</h3><div class="narr">${narrative()}<p><span class="c-green">종합</span> — ${g==='A'?'모든 단계에서 탐구 과정을 충실히 수행하였습니다. 원리 이해부터 실험 설계, 결론 도출까지 과학적으로 사고하는 능력이 돋보입니다.':`총 ${tot}점으로 ${g}등급입니다. 아래 ‘등급 올리기’에 안내된 단계만 다시 수행하면 더 높은 등급에 도전할 수 있습니다.`}</p></div>
  <h3>✍️ 내가 작성한 내용</h3>${ws.map(([t,v])=>`<div class="small c-blue">${t}</div><div class="wbox">${v?v.replace(/</g,'&lt;'):'<span class="c-sub">(작성 내용 없음)</span>'}</div>`).join('')}
 </div>
 <div class="card"><h3>📈 등급 올리기 가이드</h3><div class="up" id="up"></div></div>
 <div class="card" style="text-align:center"><div id="dl"></div><p class="small c-sub">이미지 저장이 되지 않으면 화면 캡처로 저장하여 제출하세요.</p></div>`;
 const up=m.querySelector('#up');
 if(g==='A'&&!weak.length)up.innerHTML='<span class="c-green">🎉 최고 등급 A를 달성했습니다! 모든 단계를 우수하게 수행하였습니다.</span>';
 else{up.innerHTML=g==='A'?'<div class="c-green">🎉 A등급입니다! 아래 단계를 보완하면 만점에 더 가까워질 수 있어요.</div>':`<div>다음 등급(<span style="color:${GC[gradeOf(nextT)]}">${gradeOf(nextT)}</span>)까지 <span class="c-red">${Math.round((nextT-tot)*10)/10}점</span>이 더 필요합니다. 부족했던 수행 과정만 골라 다시 도전하세요. (재도전 시 <span class="c-green">더 높은 점수</span>가 반영됩니다)</div>`;
  (weak.length?weak:[1,2,3,4,5,6].filter(n=>ST.score[n]<ST.max[n])).forEach(n=>{const it=div('it',`<div><span class="c-sun">${SNAME[n]}</span> · ${WEAK[n]}<br><span class="small c-sub">현재 ${ST.score[n]}/${ST.max[n]}점 · 최대 <span class="c-green">+${Math.round((ST.max[n]-ST.score[n])*10)/10}점</span> 상승 가능</span></div>`);
   it.appendChild(btn('🔁 이 단계만 다시 수행',()=>go(n),'btn sm ghost'));up.appendChild(it)})}
 m.querySelector('#dl').appendChild(btn('🖼️ 리포트 이미지(PNG) 다운로드',()=>{
  if(typeof html2canvas==='undefined'){toast('인터넷 연결이 필요합니다. 화면 캡처로 저장해 주세요.');return}
  html2canvas(document.getElementById('report'),{scale:2,backgroundColor:'#ffffff'}).then(c=>{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`선크림마스터_${ST.sid}_${ST.name}.png`;a.click()})},'btn green'))};

/* ===================== 시작 ===================== */
go(0);
</script>
